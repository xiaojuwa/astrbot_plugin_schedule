name: 课表查询 # 这是你的插件的唯一识别名
desc: 查询课表信息，支持按日期查询，支持课前提醒功能 # 插件简短描述
help: |
  输入 /课表 查看今天的课表
  输入 /课表 今天 查看今天的课表
  输入 /课表 明天 查看明天的课表
  输入 /课表 周一 查看下周一的课表（同理可查看周二到周日）
  输入 /开启课程提醒 开启课前1小时提醒功能
  输入 /关闭课程提醒 关闭课前提醒功能
version: v1.0.3 # 插件版本号
author: xiaojuwa # 作者
repo: https://github.com/xiaojuwa/astrbot_plugin_schedule # 插件的仓库地址